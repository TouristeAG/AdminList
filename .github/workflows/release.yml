name: Release — all platforms

# ─────────────────────────────────────────────────────────────────────────────
# USAGE
# ─────────────────────────────────────────────────────────────────────────────
# Push a version tag to trigger a full release automatically:
#
#   git tag 2.1.0
#   git push origin 2.1.0
#
# That's it. This workflow will:
#   1. Build all 7 artifacts in parallel (Android APK, 2× macOS DMG,
#      Windows MSI + EXE, Linux DEB + AppImage)
#   2. Create the GitHub Release with the correct tag and release notes
#      (from .github/release-notes/<version>.md if it exists)
#   3. Attach every artifact to the release
#
# You can also trigger this manually from Actions → Run workflow (builds
# and creates a release from the current version in version.json).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'    # e.g. 2.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+'   # e.g. v2.1.0 (leading v stripped below)
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write   # needed to create and attach release assets

# ─────────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. ANDROID APK
  # ═══════════════════════════════════════════════════════════════════════════
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "app-release-${{ steps.version.outputs.name }}.apk"
          ls -lh app-release-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app-release-*.apk
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. macOS DMG — Intel (x86_64) + Apple Silicon (arm64) in parallel
  #
  # Why two runners? jpackage bundles the host JVM, so there is no
  # cross-compilation path. Each runner produces its own native DMG.
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false    # build both arches even if one fails
      matrix:
        include:
          - runner: macos-15-intel  # GitHub-hosted Intel (x86_64) — last supported Intel runner
            arch: x86_64
          - runner: macos-15        # GitHub-hosted Apple Silicon (arm64 / M1+)
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # architecture is auto-selected by setup-java (x64 on macos-13, aarch64 on macos-14).
      # Temurin is required — Homebrew JDK ships without jpackage.
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Verify JVM is native ${{ matrix.arch }}
        run: |
          ARCH=$(java -XshowSettings:all -version 2>&1 | grep "os.arch" | awk '{print $NF}')
          echo "JVM os.arch = $ARCH"
          if [[ "${{ matrix.arch }}" == "arm64" && "$ARCH" != "aarch64" ]]; then
            echo "ERROR: expected aarch64 JVM on Apple Silicon runner, got $ARCH"; exit 1
          fi
          if [[ "${{ matrix.arch }}" == "x86_64" && "$ARCH" != "x86_64" ]]; then
            echo "ERROR: expected x86_64 JVM on Intel runner, got $ARCH"; exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      # Recompile as a universal binary so Touch ID works on both arches
      # regardless of which DMG the user downloads.
      - name: Rebuild LocalAuthenticationEngine.dylib (universal x86_64 + arm64)
        run: |
          clang \
            -arch x86_64 \
            -arch arm64 \
            -dynamiclib \
            -framework Foundation \
            -framework LocalAuthentication \
            -o shared/src/desktopMain/resources/LocalAuthenticationEngine.dylib \
            shared/nativeengines/macos/LocalAuthenticationEngine.m
          echo "Dylib archs:"
          lipo -info shared/src/desktopMain/resources/LocalAuthenticationEngine.dylib

      - name: Build macOS DMG
        run: ./gradlew :desktopApp:packageReleaseDmg --no-daemon

      # Add the arch suffix so both DMGs can coexist as release assets.
      - name: Rename DMG with architecture suffix
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          SRC=$(ls desktopApp/build/compose/packaged/main-release/dmg/*.dmg | head -1)
          DEST="NoctuList-${VERSION}-${{ matrix.arch }}.dmg"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Produced: $DEST ($(du -sh "$DEST" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. WINDOWS — MSI (installer) + EXE (standalone setup)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Windows (MSI + EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows packages
        run: ./gradlew :desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe --no-daemon

      - name: List produced files
        shell: bash
        run: |
          ls -lh desktopApp/build/compose/packaged/main-release/msi/ || true
          ls -lh desktopApp/build/compose/packaged/main-release/exe/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            desktopApp/build/compose/packaged/main-release/msi/*.msi
            desktopApp/build/compose/packaged/main-release/exe/*.exe
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. LINUX — DEB (Debian/Ubuntu) + AppImage (universal)
  # ═══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux (DEB + AppImage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fakeroot binutils libfuse2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux packages
        run: ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseAppImage --no-daemon

      # Compose names the .deb with a lowercase package name; rename to match
      # the standard NoctuList-<version>.deb format used in version.json.
      - name: Rename DEB
        run: |
          DEB=$(ls desktopApp/build/compose/packaged/main-release/deb/*.deb | head -1)
          cp "$DEB" "NoctuList-${{ steps.version.outputs.name }}.deb"
          echo "Produced: NoctuList-${{ steps.version.outputs.name }}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            NoctuList-*.deb
            desktopApp/build/compose/packaged/main-release/appImage/*.AppImage
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. PUBLISH RELEASE
  #
  # Waits for ALL build jobs to succeed, then:
  #   • Downloads every artifact from the workflow run
  #   • Creates the GitHub Release (tag created automatically if missing)
  #   • Attaches all files to the release
  #
  # If any build job fails, this job is skipped and the release is NOT
  # created — preventing a half-baked release with missing artifacts.
  # ═══════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve the version tag:
      #   • Tag push  → use the pushed tag (strip optional leading 'v')
      #   • workflow_dispatch → read from version.json
      - name: Resolve version & tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          fi
          VER="${TAG#v}"   # strip leading 'v' if present
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG  version=$VER"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true    # flatten into a single directory

      - name: List release artifacts
        run: ls -lh release-artifacts/

      # Use the per-version release notes if they exist (.github/release-notes/<ver>.md),
      # otherwise fall back to the changelogShort string in version.json.
      - name: Prepare release notes
        id: notes
        run: |
          NOTES_FILE=".github/release-notes/${{ steps.version.outputs.name }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "Using $NOTES_FILE"
            echo "body_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No release notes file found, generating from version.json"
            CHANGELOG=$(python3 -c "import json; print(json.load(open('version.json'))['changelogShort'])")
            {
              echo "## NoctuList ${{ steps.version.outputs.name }}"
              echo ""
              echo "$CHANGELOG"
              echo ""
              echo "---"
              echo "Full changelog: [CHANGELOG.md](CHANGELOG.md)"
            } > /tmp/release-body.md
            echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NoctuList ${{ steps.version.outputs.name }}"
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: ${{ inputs.prerelease == 'true' }}
          make_latest: true
          fail_on_unmatched_files: false
          files: release-artifacts/*
