name: Desktop Windows release

on:
  # NOTE: Automatic release builds are handled by release.yml (triggered on tag push).
  # Use this workflow only for standalone manual builds (e.g. to test packaging).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from version.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"latestVersionName"[[:space:]]*:[[:space:]]*"[^"]*"' version.json | sed 's/.*"\([^"]*\)"$/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows packages
        run: |
          ./gradlew :desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe --no-daemon

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: noctulist-windows-desktop
          path: |
            desktopApp/build/compose/packaged/main-release/msi/*.msi
            desktopApp/build/compose/packaged/main-release/exe/*.exe

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktopApp/build/compose/packaged/main-release/msi/*.msi
            desktopApp/build/compose/packaged/main-release/exe/*.exe
